[project]
name = "marathon-agents"
version = "0.1.0"
description = "Multi-agent marathon planning system with ADK, A2A, and Vertex AI Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds are deliberate: the codelab only declares floors (>=), which
    # today resolve to the next major version of all three packages, where
    # APIs used by the codelab code are gone. See docs/FIXES.md, section 1.
    #
    # Same reason as ADK and a2a-sdk: the next major changes APIs in use.
    "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.121.0,<2",
    # The codelab targets ADK 1.x. ADK 2.x changed the signature of
    # RemoteA2aAgent._resolve_agent_card_from_url(), which breaks the
    # SerializableRemoteA2aAgent override (Full Team mode).
    "google-adk>=1.25.0,<2",
    # The codelab uses the a2a-sdk 0.3.x API (a2a.server.apps, TextPart,
    # ServerError...), which a2a-sdk 1.x removed. The [http-server] extra
    # brings starlette, required by A2AStarletteApplication (the codelab
    # does not declare it).
    "a2a-sdk[http-server]>=0.3.9,<0.4",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "google-auth>=2.0.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# Optional workshop exercises fail until solved, so they are skipped by
# default. Run them with:  uv run pytest -m exercise -k ex2
addopts = "-m 'not exercise'"
markers = ["exercise: optional workshop exercise (fails until solved, see docs/EXERCISES.md)"]
